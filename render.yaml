services:
  # 1. VoxShield AI — FastAPI Backend Web Service
  - type: web
    name: voxshield-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_THRESHOLD
        value: "0.65"

  # 2. VoxShield AI — React + Vite Frontend Static Site
  - type: web
    name: voxshield-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: voxshield-ai-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
