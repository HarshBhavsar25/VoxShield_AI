services:
  # 1. VoxShield AI — FastAPI Backend Web Service (Free Tier)
  - type: web
    name: voxshield-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_THRESHOLD
        value: "0.65"

  # 2. VoxShield AI — React + Vite Frontend Static Site (Always Free)
  - type: web
    name: voxshield-ai-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: voxshield-ai-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
